name: Production Tag Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# prod 배포는 GitHub Release 발행(태그)로만 이뤄진다 — "최신 Release 태그 = 현재 prod".
#   - 정식 배포: minor 릴리스 vX.Y.0 발행
#   - hotfix   : 최신 태그에서 분기 → 수정 → 패치 릴리스 vX.Y.Z 발행 → main 으로 포워드포트
# 브랜치 push(v*)·hotfix PR→main 경로는 prod 를 태그 라인에서 이탈시켜 제거했다(2026-08 회귀 사고).
# 상세 절차: docs/guides/deployment-runbook.md
on:
  release:
    types: [published]

# 동일 prod 배포가 중복/연속 트리거되면 이전 실행을 취소해 이중 배포를 막는다.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  Deploy-Production:
    if: github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # 버전(package.json) 범프는 CI 가 아니라 "릴리스 커밋"에 포함한다 —
  # 태그된(=배포되는) 커밋이 자기 버전을 갖도록. 절차: docs/guides/deployment-runbook.md · 헬퍼: scripts/release.sh
